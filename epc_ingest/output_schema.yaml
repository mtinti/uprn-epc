- name: rrn
  type: string
  width: 24
  nullable: true
  source: REPORT_REFERENCE_NUMBER
  description: The report reference number as published where not empty, NULL where empty (9% of rows, mostly 2013 to 2016).
    Unique where present.
  group: derived
- name: uprn_sepcr
  type: int64
  nullable: false
  source: BUILDING_REFERENCE_NUMBER
  description: The register's own 10-digit property reference, trimmed and as an integer. Not the Gazetteer UPRN. Present
    in every row.
  group: derived
- name: uprn_osg
  type: int64
  nullable: true
  source: OSG_REFERENCE_NUMBER
  description: The One Scotland Gazetteer UPRN as an integer, NULL where the published cell is empty (4.7% of rows). The only
    column a join compares; a padded cohort UPRN matches once cast to bigint.
  group: derived
- name: pc_norm
  type: string
  width: 8
  nullable: true
  source: POSTCODE
  description: POSTCODE upper-cased with every space removed, postcode-simd's pc_norm. NULL where the published cell is empty.
    Nothing repaired.
  group: derived
- name: datazone_2001
  type: string
  width: 9
  nullable: true
  source: DATA_ZONE
  description: The 2001 data zone code when DATA_ZONE starts with S01 and six digits followed by a space or the end, otherwise
    NULL.
  group: derived
- name: datazone_2001_status
  type: string
  width: 16
  nullable: false
  source: DATA_ZONE
  description: code, empty, not_a_datazone (for 00Q, NA and the like) or unknown_code (well formed, not in the pinned list;
    the build fails if any).
  group: derived
- name: datazone_2011
  type: string
  width: 9
  nullable: true
  source: DATA_ZONE_2011
  description: The 2011 data zone code by the same rule, otherwise NULL.
  group: derived
- name: datazone_2011_status
  type: string
  width: 16
  nullable: false
  source: DATA_ZONE_2011
  description: As datazone_2001_status, for the 2011 column.
  group: derived
- name: inspection_date_parsed
  type: date
  nullable: false
  source: INSPECTION_DATE
  description: 'INSPECTION_DATE (yyyy-mm-dd) as a date: the day the assessor saw the dwelling. The dated joins choose the
    certificate by it. A value that does not parse stops the build.'
  group: derived
- name: lodgement_date_parsed
  type: date
  nullable: false
  source: LODGEMENT_DATE
  description: LODGEMENT_DATE (yyyy-mm-dd) as a date. The administrative date of the certificate, the same day as the inspection
    or soon after (median 1 day); the ten-year validity runs from it. Outliers (2002, 2006, 2108) are kept as published.
  group: derived
- name: created_at_parsed
  type: datetime
  nullable: false
  source: CREATED_AT
  description: CREATED_AT (dd/mm/yyyy hh:mm:ss) as a timestamp to the second. Its year is the file year.
  group: derived
- name: historic_flag
  type: bool
  nullable: false
  source: HISTORIC
  description: 1 where HISTORIC is True (the certificate has been superseded), 0 where False. Any other value stops the build.
  group: derived
- name: current_energy_efficiency_int
  type: int32
  nullable: false
  source: CURRENT_ENERGY_EFFICIENCY
  description: The current energy efficiency rating as an integer. A SAP rating runs 1 to 100; values above 100 are publisher
    errors kept as published and counted in the build report.
  group: derived
- name: potential_energy_efficiency_int
  type: int32
  nullable: false
  source: POTENTIAL_ENERGY_EFFICIENCY
  description: The potential energy efficiency rating as an integer.
  group: derived
- name: environment_impact_current_int
  type: int32
  nullable: false
  source: ENVIRONMENT_IMPACT_CURRENT
  description: The current environmental impact rating as an integer.
  group: derived
- name: environment_impact_potential_int
  type: int32
  nullable: false
  source: ENVIRONMENT_IMPACT_POTENTIAL
  description: The potential environmental impact rating as an integer.
  group: derived
- name: total_floor_area_int
  type: int32
  nullable: false
  source: TOTAL_FLOOR_AREA
  description: Total floor area in square metres as an integer. 0 in every 2008 and 2009 row.
  group: derived
- name: energy_consumption_current_num
  type: decimal
  nullable: false
  source: ENERGY_CONSUMPTION_CURRENT
  description: Primary energy indicator (kWh per square metre per year) as decimal(19,4).
  group: derived
- name: co2_emissions_current_num
  type: decimal
  nullable: false
  source: CO2_EMISSIONS_CURRENT
  description: Current emissions (tonnes of CO2 per year) as decimal(19,4).
  group: derived
