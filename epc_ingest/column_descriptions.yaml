# What each column is, for the data dictionary and the provenance site. Generated once by
# tools/extract_note_dictionary.py from the pinned publication note (attribution: note, with the
# page), then reviewed by eye (the `review` block); the key and derived columns are described
# by the project (attribution: project). Edit by hand after review; regenerate only for a new
# note, then review again. A `shared_entry` names the field whose single note entry covers a
# trio of element columns; `see_also` points an "As above" entry at the entry it refers to.
version: 1
note:
  file: epc_2026Q2/publication_note.pdf
  sha256: c2f336967e5d9a6dd24fc8c842c81b23f9ae911f092778c1cef4426e332e982e
  title: Domestic EPC extended historic data publication note, Q2 2026 extract, Scottish Government
  licence: Open Government Licence v3.0; quoted with attribution
review:
  date: '2026-10-31'
  by: Michele Tinti with Claude Fable 5.1 (AI-assisted)
  record: docs/reviews/2026-10-31-column-descriptions.md
  method: Every note entry compared with the extracted text of the pinned PDF, page by page; labels stripped at
    the seams by the exact phrases typed from the PDF; three cases handled by name.
  notes:
    CO2_EMISSIONS_CURRENT: The note says 'total annual emissions reduction' for the current emissions; the wording
      is the publisher's and is kept.
    HEAT_LOSS_CORRIDOOR: The machine name carries the double O as published.
    UNHEATED_CORRIDOR_LENGTH: The note gives the unit as m² for a length; kept as printed.
    REPORT_REFERENCE_NUMBER: '''of and EPC'' is the note''s text.'
