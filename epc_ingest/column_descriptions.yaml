  text: 'Reports Primary Energy - the amount of energy required at source, before conversion and transmission, to
    meet the calculated energy demand of the dwelling, if recommended improvement measures are carried out (Units:
    kWh/m²/year).'
  note_label: Energy Consumption Potential
- name: EXTENSION_COUNT
  attribution: note
  note_name: EXTENSION_COUNT
  scotland_only: false
  page: 14
  text: The number of extensions added to the property. Between 0 and 4 can be reported.
  note_label: Extensions Count
- name: FIXED_LIGHTING_OUTLETS_COUNT
  attribution: note
  note_name: FIXED_LIGHTING_OUTLETS_COUNT
  scotland_only: false
  page: 14
  text: The number of fixed lighting outlets in the dwelling.
  note_label: Fixed Lighting Outlets Count
- name: LOW_ENERGY_FIXED_LIGHT_COUNT
  attribution: note
  note_name: LOW_ENERGY_FIXED_LIGHT_COUNT
  scotland_only: false
  page: 14
  text: The number of low-energy fixed lighting outlets.
  note_label: Low Energy Lighting Outlets Count
- name: LOW_ENERGY_LIGHTING
  attribution: note
  note_name: LOW_ENERGY_LIGHTING
  scotland_only: false
  page: 14
  text: The percentage of low energy lighting present in the property as a percentage of the total fixed lights
    in the property. 0% indicates that no low-energy lighting is present.
  note_label: Low Energy Lighting %
- name: FLOOR_LEVEL
  attribution: note
  note_name: FLOOR_LEVEL
  scotland_only: false
  page: 14
  text: Floor level relative to the lowest level of the building
  note_label: Flat Level
- name: FLAT_TOP_STOREY
  attribution: note
  note_name: FLAT_TOP_STOREY
  scotland_only: false
  page: 14
  text: The number of storeys in the flatted block.
  note_label: Flat Location
- name: GLAZED_AREA
  attribution: note
  note_name: GLAZED_AREA
  scotland_only: false
  page: 14
  text: 'Ranged estimate of the total glazed area of the Habitable Area: 0 – New dwelling 1 – Typical glazing 2
    – More than typical 3 – Less than typical 4 – Much more than typical 5 – Much less than typical'
  note_label: Glazed Area
- name: NUMBER_HABITABLE_ROOMS
  attribution: note
  note_name: NUMBER_HABITABLE_ROOMS
  scotland_only: false
  page: 14
  text: Habitable rooms include any living room, sitting room, dining room, bedroom, study and similar. Excludes
    any room used solely as a kitchen, utility room, sanitary accommodation and any hallway, stairs, or landing;
    and also any conservatory or room without a window.
  note_label: Habitable Room Count
- name: HEAT_LOSS_CORRIDOOR
  attribution: note
  note_name: HEAT_LOSS_CORRIDOOR
  scotland_only: false
  page: 15
  text: 'Flats and maisonettes only. Indicates that the flat contains a corridor through which heat is lost. Heat
    loss corridor, one of: no corridor; heated corridor; unheated corridor'
  note_label: Heat Loss Corridor
- name: NUMBER_HEATED_ROOMS
  attribution: note
  note_name: NUMBER_HEATED_ROOMS
  scotland_only: false
  page: 15
  text: The number of heated habitable rooms in the property.
  note_label: Heated Room Count
- name: LOCAL_AUTHORITY_LABEL
  attribution: note
  note_name: LOCAL_AUTHORITY_LABEL
  scotland_only: false
  page: 15
  text: The name of the local authority area in which the building is located.
  note_label: Local Authority
- name: MAINS_GAS_FLAG
  attribution: note
  note_name: MAINS_GAS_FLAG
  scotland_only: false
  page: 15
  text: Whether mains gas is available. Yes means that there is a gas meter or a gas-burning appliance in the dwelling
  note_label: Mains Gas
- name: MAIN_HEATING_CATEGORY
  attribution: note
  note_name: MAIN_HEATING_CATEGORY
  scotland_only: true
  page: 15
  text: Reports the type of main heating system present in the dwelling. Lists both heat source and heat emitters
    (e.g. gas boiler and radiators).
  note_label: Main heating
- name: MAIN_FUEL
  attribution: note
  note_name: MAIN_FUEL
  scotland_only: false
  page: 15
  text: Reports the fuel type used by the main heating system present in the dwelling.
  note_label: Main heating fuel type
- name: MAIN_HEATING_CONTROLS
  attribution: note
  note_name: MAIN_HEATING_CONTROLS
  scotland_only: false
  page: 15
  text: Type of main heating controls. Includes both main heating systems if there are two.
  note_label: Main Heating 1 Control
- name: MECHANICAL_VENTILATION
  attribution: note
  note_name: MECHANICAL_VENTILATION
  scotland_only: false
  page: 15
  text: Identifies the type of mechanical ventilation the property has.
  note_label: Mechanical Ventilation
- name: ENERGY_TARIFF
  attribution: note
  note_name: ENERGY_TARIFF
  scotland_only: false
  page: 15
  text: Type of electricity tariff for the property (by meter type), e.g. single.
  note_label: Meter Type
- name: MULTI_GLAZE_PROPORTION
  attribution: note
  note_name: MULTI_GLAZE_PROPORTION
  scotland_only: false
  page: 15
  text: The estimated banded range (e.g. 0% - 10%) of the total glazed area of the Property that is multiple glazed.
  note_label: Multiple Glazed Proportion
- name: GLAZED_TYPE
  attribution: note
  note_name: GLAZED_TYPE
  scotland_only: false
  page: 15
  text: The type of glazing. From British Fenestration Rating Council or manufacturer declaration, one of; single;
    double; triple.
  note_label: Multiple Glazing Type
- name: NUMBER_OPEN_FIREPLACES
  attribution: note
  note_name: NUMBER_OPEN_FIREPLACES
  scotland_only: false
  page: 16
  text: The number of Open Fireplaces in the Property. An Open Fireplace is a fireplace that still allows air to
    pass between the inside of the Property and the outside.
  note_label: Open Fireplaces Count
- name: PHOTO_SUPPLY
  attribution: note
  note_name: PHOTO_SUPPLY
  scotland_only: false
  page: 16
  text: 'Photovoltaic area as a percentage of total roof area. 0% indicates that a Photovoltaic Supply is not present
    in the property. Note: multiple arrays can be reported. Each array reported is separated by a vertical line
    [ “|” - ASCII (decimal) 124]'
  note_label: Photovoltaic Supply
- name: SOLAR_WATER_HEATING_FLAG
  attribution: note
  note_name: SOLAR_WATER_HEATING_FLAG
  scotland_only: false
  page: 16
  text: Indicates whether the water heating in the property is served by solar thermal panels.
  note_label: Solar Water Heating
- name: TENURE
  attribution: note
  note_name: TENURE
  scotland_only: false
  page: 16
  text: 'Describes the tenure type of the property. One of: Owner- occupied; Rented (social); Rented (private);
    Unknown'
  note_label: Tenure
- name: TRANSACTION_TYPE
  attribution: note
  note_name: TRANSACTION_TYPE
  scotland_only: false
  page: 16
  text: 'Type of transaction or purpose that triggered EPC assessment. One of: - new dwelling; marketed sale; non-marketed
    sale; rental; not sale or rental; assessment for Green Deal; following Green Deal; FIT application; RHI application;
    ECO assessment; none of the above. Where the reason for the assessment is unknown by the energy assessor the
    transaction type will be recorded as ''none of the above''.'
  note_label: Transaction Type
- name: UNHEATED_CORRIDOR_LENGTH
  attribution: note
  note_name: UNHEATED_CORRIDOR_LENGTH
  scotland_only: false
  page: 16
  text: The total length of unheated corridor in the flat. Only populated if flat or maisonette contains unheated
    corridor. If unheated corridor, length of sheltered wall (m²).
  note_label: Unheated Corridor Length
- name: CONSTITUENCY
  attribution: note
  note_name: CONSTITUENCY
  scotland_only: false
  page: 16
  text: Code for Parliamentary constituency in which the building is located. Scottish area defined as 'Ward', not
    'constituency'
  note_label: Ward Code
- name: CONSTITUENCY_LABEL
  attribution: note
  note_name: CONSTITUENCY_LABEL
  scotland_only: false
  page: 16
  text: Name of Parliamentary constituency in which the building is located. Scottish area defined as 'Ward', not
    'constituency'
  note_label: Ward Name
- name: WIND_TURBINE_COUNT
  attribution: note
  note_name: WIND_TURBINE_COUNT
  scotland_only: false
  page: 16
  text: Number of wind turbines; 0 if none.
  note_label: Wind Turbines Count
- name: BUILT_FORM
  attribution: note
  note_name: BUILT_FORM
  scotland_only: false
  page: 17
  text: The building type of the Property e.g. Detached, Semi-Detached, Terrace etc. Together with the Property
    Type, the Build Form produces a structured description of the property
  note_label: Built Form
- name: PROPERTY_TYPE
  attribution: note
  note_name: PROPERTY_TYPE
  scotland_only: false
  page: 17
  text: Describes the type of property such as House, Flat, Maisonette etc. This is the type differentiator for
    dwellings.
  note_label: Property Type
- name: DATA_ZONE_2011
  attribution: project
  text: Not defined in the publication note, which lists 106 data elements and omits this one. A 2011 data zone
    code (S01 and six digits) assigned by the register, checked by the build against the pinned 2011 data zone lookup.
- name: CREATED_AT
  attribution: note
  note_name: CREATED_AT
  scotland_only: true
  page: 17
  text: The date and time that the certificate was lodged on the register.
  note_label: Created At
- name: REPORT_REFERENCE_NUMBER
  attribution: note
  note_name: REPORT_REFERENCE_NUMBER
  scotland_only: false
  page: 17
  text: Unique, auto-generated number produced on the lodgement of and EPC to the SEPCR.
  note_label: RRN
- name: epc_release
  attribution: project
  text: The release of the extract this row came from, 2026Q2. A later release is a new build.
- name: source_year
  attribution: project
  text: The annual file the row came from (2008 to 2026), which is the year of CREATED_AT.
- name: source_row
  attribution: project
  text: 1 for the first data row of the file, which is file row 3 after the two header rows.
- name: rrn
  attribution: project
  text: The report reference number as published where not empty, NULL where empty (9% of rows, mostly 2013 to 2016).
    Unique where present.
- name: uprn_sepcr
  attribution: project
  text: The register's own 10-digit property reference, trimmed and as an integer. Not the Gazetteer UPRN. Present
    in every row.
- name: uprn_osg
  attribution: project
  text: The One Scotland Gazetteer UPRN as an integer, NULL where the published cell is empty (4.7% of rows). The
    only column a join compares; a padded cohort UPRN matches once cast to bigint.
- name: pc_norm
  attribution: project
  text: POSTCODE upper-cased with every space removed, postcode-simd's pc_norm. NULL where the published cell is
    empty. Nothing repaired.
- name: datazone_2001
  attribution: project
  text: The 2001 data zone code when DATA_ZONE starts with S01 and six digits followed by a space or the end, otherwise
    NULL.
- name: datazone_2001_status
  attribution: project
  text: code, empty, not_a_datazone (for 00Q, NA and the like) or unknown_code (well formed, not in the pinned list;
    the build fails if any).
- name: datazone_2011
  attribution: project
  text: The 2011 data zone code by the same rule, otherwise NULL.
- name: datazone_2011_status
  attribution: project
  text: As datazone_2001_status, for the 2011 column.
- name: inspection_date_parsed
  attribution: project
  text: 'INSPECTION_DATE (yyyy-mm-dd) as a date: the day the assessor saw the dwelling. The dated joins choose the
    certificate by it. A value that does not parse stops the build.'
- name: lodgement_date_parsed
  attribution: project
  text: LODGEMENT_DATE (yyyy-mm-dd) as a date. The administrative date of the certificate, the same day as the inspection
    or soon after (median 1 day); the ten-year validity runs from it. Outliers (2002, 2006, 2108) are kept as published.
- name: created_at_parsed
  attribution: project
  text: CREATED_AT (dd/mm/yyyy hh:mm:ss) as a timestamp to the second. Its year is the file year.
- name: historic_flag
  attribution: project
  text: 1 where HISTORIC is True (the certificate has been superseded), 0 where False. Any other value stops the
    build.
- name: current_energy_efficiency_int
  attribution: project
  text: The current energy efficiency rating as an integer. A SAP rating runs 1 to 100; values above 100 are publisher
    errors kept as published and counted in the build report.
- name: potential_energy_efficiency_int
  attribution: project
  text: The potential energy efficiency rating as an integer.
- name: environment_impact_current_int
  attribution: project
  text: The current environmental impact rating as an integer.
- name: environment_impact_potential_int
  attribution: project
  text: The potential environmental impact rating as an integer.
- name: total_floor_area_int
  attribution: project
  text: Total floor area in square metres as an integer. 0 in every 2008 and 2009 row.
- name: energy_consumption_current_num
  attribution: project
  text: Primary energy indicator (kWh per square metre per year) as decimal(19,4).
- name: co2_emissions_current_num
  attribution: project
  text: Current emissions (tonnes of CO2 per year) as decimal(19,4).
- name: co2_emiss_curr_per_floor_area_num
  attribution: project
  text: Current emissions per floor area (kg of CO2 per square metre per year) as decimal(19,4).
